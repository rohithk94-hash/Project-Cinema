name: Check discovery film leads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/feature-film-leads.json'
      - 'scripts/check_feature_film_leads.py'
      - '.github/workflows/check-feature-film-leads.yml'
permissions:
  contents: write
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/check_feature_film_leads.py
      - name: Commit metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/feature-film-lead-checks.json
          git diff --cached --quiet || (git commit -m "Update discovery channel identity checks" && git push)

name: Update Rotten Tomatoes movie catalog
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_rt_catalog.py'
      - '.github/workflows/update-rt-catalog.yml'
  schedule:
    - cron: '0 10 1 * *'
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/build_rt_catalog.py
      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rt-free-movies.json
          git diff --cached --quiet || (git commit -m "Refresh RT free movie discovery catalog" && git push)

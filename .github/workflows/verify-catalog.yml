name: Inspect YouTube video metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_catalog.py'
      - '.github/workflows/verify-catalog.yml'
permissions:
  contents: write
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check YouTube metadata without claiming playback
        run: python scripts/verify_catalog.py
      - name: Store verification snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-link-checks.json
          git diff --cached --quiet || (git commit -m "Record direct YouTube link metadata checks" && git push)
